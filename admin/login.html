<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Capernaum Solutions</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/premium.css">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: #0a0a1a;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #fff;
        }

        .login-scene {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at top right, #1a1a2e, #0a0a1a);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 48px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .login-logo {
            width: 80px;
            margin-bottom: 24px;
        }

        .login-card h2 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .login-card p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 32px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: #fff;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--gold);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(200, 164, 94, 0.15);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: var(--gradient-gold);
            border: none;
            border-radius: 12px;
            color: #1a1a2e;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: var(--shadow-gold);
        }

        .login-btn:hover {
            box-shadow: 0 12px 30px rgba(200, 164, 94, 0.4);
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: var(--gold);
        }
    </style>
</head>

<body>
    <div class="login-scene">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <div class="login-card">
        <img src="../images/capernaum_12.png" alt="Capernaum Solutions" class="login-logo">
        <h2>Admin Portal</h2>
        <p>Enter your credentials to manage enquiries</p>

        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" class="form-input" placeholder="admin" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn">Secure Login</button>
        </form>

        <a href="../index.html" class="back-link">Return to Website</a>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            // In a real app, you would validate via your Java API
            // For now, redirecting to the dashboard
            window.location.href = 'index.html';
        });
    </script>
</body>

</html>
